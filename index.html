<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      try {
        const savedTheme = localStorage.getItem('portfolio-theme');
        document.documentElement.dataset.theme = savedTheme === 'light' ? 'light' : 'dark';
        document.documentElement.style.colorScheme = document.documentElement.dataset.theme;
      } catch {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#11110f" />
    <meta name="description" content="Maneru Niharika is a full-stack software engineer working across backend systems, real-time applications, APIs, performance, and applied AI." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Maneru Niharika — Full-Stack Software Engineer" />
    <meta property="og:description" content="Backend systems · Real-time applications · Applied AI" />
    <meta property="og:image" content="/og-portfolio.svg" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
